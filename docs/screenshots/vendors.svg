  <rect x="110" y="400" width="13" height="13" fill="#16a34a" rx="2"/>
  <text x="126" y="411" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="130" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Vegetables</text>
  <rect x="210" y="400" width="13" height="13" fill="#16a34a" rx="2"/>
  <text x="226" y="411" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="230" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Herbs</text>
  <rect x="280" y="400" width="13" height="13" fill="white" stroke="#d1d5db" rx="2"/>
  <text x="298" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Fruits</text>
  <rect x="340" y="400" width="13" height="13" fill="#16a34a" rx="2"/>
  <text x="356" y="411" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">✓</text>
  <text x="360" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Flowers</text>
  <rect x="426" y="400" width="13" height="13" fill="white" stroke="#d1d5db" rx="2"/>
  <text x="444" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Trees</text>
  <rect x="486" y="400" width="13" height="13" fill="white" stroke="#d1d5db" rx="2"/>
  <text x="504" y="411" font-family="Arial, sans-serif" font-size="11" fill="#374151">Specialty</text>
  <text x="40" y="448" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Multiple categories can be selected — badges appear on the vendor card for each one</text>
  <rect x="40" y="460" width="20" height="20" fill="#6b7280" rx="3"/>
  <text x="50" y="473" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">🚚</text>
  <text x="66" y="473" font-family="Arial, sans-serif" font-size="11" fill="#374151">Ships orders</text>
  <rect x="150" y="460" width="20" height="20" fill="#6b7280" rx="3"/>
  <text x="160" y="473" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">🛍</text>
  <text x="176" y="473" font-family="Arial, sans-serif" font-size="11" fill="#374151">Local pickup</text>
